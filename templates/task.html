{% extends "base.html" %}
{% block title %}{{ task.task_id }} · {% if task.status == "ARCHIVE" %}Archive{% else %}Board{% endif %}{% endblock %}
{% block content %}
<section class="task-page-editor" id="task-modal">
  <div class="task-dialog" aria-labelledby="task-dialog-title">
    <div class="dialog-header"><h2 id="task-dialog-title">Edit {{ task.task_id }}</h2></div>
    <form id="task-form" class="task-form">
      <input type="hidden" id="task-mode" value="edit"><input type="hidden" id="task-key" value="{{ task.task_id }}">
      <div class="field-control"><label for="task-id">Task ID</label><input id="task-id" name="task_id" maxlength="120" required><p class="field-error" data-error="task_id"></p></div>
      <div class="field-control"><label for="task-title">Title</label><input id="task-title" name="title" maxlength="1000" required><p class="field-error" data-error="title"></p></div>
      <div class="field-control"><label for="task-description">Description</label><textarea id="task-description" name="description" maxlength="32000" required></textarea><p class="field-error" data-error="description"></p></div>
      <div class="field-control" id="status-control"><label for="task-status">Status</label><select id="task-status" name="status"></select><p class="field-error" data-error="status"></p></div>
      <div class="field-control"><label>File upload</label><div id="file-upload-list" class="file-upload-list"><div class="file-upload-row"><input class="task-file-input" type="file"><button class="button file-upload-remove" type="button" hidden>Remove</button></div></div><button class="button file-upload-add" id="add-file-upload" type="button">Add file</button><div id="attachment-list" class="attachment-list"></div><p class="field-error" data-error="files"></p></div>
      <div class="form-actions">{% if task.status == "ARCHIVE" %}<button class="button danger" id="delete-task" type="button">Delete</button>{% else %}<button class="button danger" id="delete-task" type="button" hidden>Delete</button><button class="button" id="reopen-task" type="button" hidden>REOPEN</button><button class="button" id="done-task" type="button" hidden>DONE</button><button class="button" id="archive-task" type="button" hidden>To Archive</button><button class="button primary" id="save-task" type="submit">Save</button>{% endif %}</div>
    </form>
  </div>
</section>
{% endblock %}
{% block page_scripts %}<link rel="stylesheet" href="{{ url_for('static', path='css/board.css') }}"><script>window.openTaskId = {{ task.task_id|tojson }}; window.openTaskStatus = {{ task.status|tojson }};</script><script src="{{ url_for('static', path='js/marked.umd.js') }}"></script><script src="{{ url_for('static', path='js/task-chat.js') }}"></script><script src="{{ url_for('static', path='js/board.js') }}"></script>{% endblock %}
